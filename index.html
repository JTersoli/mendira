<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Una lección de euskera en altura. Subí al monte, aprendé ocho palabras y mirate bien en el espejo.">
<title>Mendira!</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  /* Una sola pantalla. El fondo es una escena pixel art que cambia con la etapa;
     el caminante sube por el sendero de la montaña y las tarjetas son cuadros de diálogo
     tipo RPG apoyados abajo. */
  :root {
    --bg: #a9d4ef;
    --fg: #2a2520;
    --muted: #6b625a;
    --card: rgba(255, 250, 240, 0.94);
    --card-edge: #3b2f24;
    --accent: #c8402f;      /* rojo de ikurriña, apagado */
    --accent-ink: #fff6f2;
    --basque: #2e7d4f;      /* verde de ikurriña */
    --display: "Pixelify Sans", "Trebuchet MS", "Segoe UI", sans-serif;
    --body: "Nunito", "Segoe UI", system-ui, sans-serif;
    --fade: 900ms;
    color-scheme: light;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.45;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  img { max-width: 100%; }

  /* Dos capas de fondo para fundir entre escenas */
  .bg {
    position: fixed; inset: 0; z-index: 0;
    background-size: cover;
    background-repeat: no-repeat;
    background-position: 38% 50%;
    opacity: 0;
    transition: opacity var(--fade) ease;
  }
  .bg.on { opacity: 1; }

  #hiker {
    position: fixed; z-index: 2; pointer-events: none;
    width: 46px; height: auto;
    transform: translate(-50%, -92%);
    transition: left 1400ms ease-in-out, top 1400ms ease-in-out, opacity 600ms;
    filter: drop-shadow(0 3px 2px rgba(0,0,0,0.35));
    opacity: 0;
  }
  #hiker.on { opacity: 1; animation: bob 700ms ease-in-out infinite; }
  @keyframes bob { 0%,100% { margin-top: 0 } 50% { margin-top: -3px } }

  #stage {
    position: relative; z-index: 3;
    height: 100%;
    display: grid;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 18px;
    box-sizing: border-box;
  }
  .scene {
    width: min(100%, 520px);
    justify-self: center;
    align-self: end;
    display: grid; gap: 12px; justify-items: center;
    animation: rise 480ms cubic-bezier(.2,.8,.2,1) both;
  }
  .scene.center { align-self: center; text-align: center; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  /* Cuadro de diálogo */
  .card {
    width: 100%; box-sizing: border-box;
    background: var(--card);
    border: 3px solid var(--card-edge);
    border-radius: 8px;
    box-shadow: 0 0 0 3px rgba(255,250,240,0.85), 0 14px 30px -14px rgba(0,0,0,0.55);
    padding: 16px 18px;
    display: grid;
    grid-template-columns: 112px 1fr;
    gap: 6px 18px;
    align-items: center;
  }
  .card.solo { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .card .pic {
    grid-row: 1 / span 4;
    width: 112px; height: 112px; object-fit: contain;
    filter: drop-shadow(0 4px 3px rgba(0,0,0,0.25));
    animation: pop 500ms 120ms cubic-bezier(.3,1.5,.5,1) both;
  }
  .card .pic.round { border-radius: 10px; object-fit: cover; border: 2px solid var(--card-edge); }
  @keyframes pop { from { opacity: 0; transform: scale(0.4) rotate(-8deg); } to { opacity: 1; transform: none; } }
  .counter {
    font-family: var(--display); font-size: 0.85rem; letter-spacing: 0.08em;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .eu {
    font-family: var(--display); font-weight: 700;
    font-size: 2.1rem; line-height: 1; color: var(--fg); text-wrap: balance;
  }
  .es { font-weight: 700; color: var(--basque); font-size: 1.05rem; }
  .note { margin: 0; color: var(--muted); text-wrap: pretty; max-width: 36ch; }
  .note.lead { color: var(--fg); font-size: 1.1rem; }
  .card > .btn { grid-column: 1 / -1; justify-self: center; margin-top: 6px; }

  @media (max-width: 440px) {
    .card { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 4px; padding: 14px 16px; }
    .card .pic { grid-row: auto; width: 96px; height: 96px; }
    .eu { font-size: 1.8rem; }
    .note { max-width: none; }
  }

  h1 {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(3.4rem, 15vw, 5.4rem); line-height: 0.95; margin: 0;
    color: #fffaf0;
    text-shadow: 0 3px 0 #3b2f24, 0 0 24px rgba(0,0,0,0.35);
    letter-spacing: 0.01em;
  }
  .sub {
    margin: 0; font-family: var(--display); font-size: 1.3rem; color: #fffaf0;
    text-shadow: 0 2px 0 #3b2f24;
  }
  .sub small { display: block; font-family: var(--body); font-size: 1rem; margin-top: 4px; opacity: 0.95; }

  .btn {
    font: 700 1.05rem var(--body);
    background: var(--accent); color: var(--accent-ink);
    border: 3px solid var(--card-edge); border-radius: 8px;
    padding: 12px 24px; cursor: pointer;
    box-shadow: 0 4px 0 var(--card-edge);
    transition: transform 100ms ease, box-shadow 100ms ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--card-edge); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  .hint {
    margin: 0; font-family: var(--display); font-size: 0.9rem; letter-spacing: 0.06em;
    color: #fffaf0; text-shadow: 0 2px 0 #3b2f24, 0 0 10px rgba(0,0,0,0.4);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.55 } 50% { opacity: 1 } }

  /* El espejo */
  .mirror {
    position: relative;
    height: min(44vh, 380px); aspect-ratio: 783 / 900; max-width: 100%;
    filter: drop-shadow(0 12px 18px rgba(0,0,0,0.45));
    cursor: pointer;
  }
  .mirror img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .mirror .horse { opacity: 0; }
  .mirror.warp { animation: shake 1.4s ease-in-out both; }
  .mirror.warp .horse { animation: appear 1.6s ease-in-out 300ms both; }
  .mirror.warp .empty { animation: melt 1.6s ease-in-out 300ms both; }
  @keyframes shake {
    0%,100% { transform: translateX(0) }
    15% { transform: translateX(-5px) rotate(-1.2deg) }
    35% { transform: translateX(6px) rotate(1.5deg) }
    55% { transform: translateX(-7px) rotate(-1.5deg) }
    75% { transform: translateX(5px) rotate(1deg) }
  }
  @keyframes melt {
    0%   { opacity: 1; filter: blur(0); }
    50%  { opacity: 1; filter: blur(4px) hue-rotate(40deg); }
    100% { opacity: 0; filter: blur(8px); }
  }
  @keyframes appear {
    0%   { opacity: 0; filter: blur(8px); transform: scale(1.08) skew(6deg); }
    60%  { opacity: 1; filter: blur(3px); transform: scale(0.98) skew(-3deg); }
    100% { opacity: 1; filter: blur(0); transform: none; }
  }

  /* El final */
  .horse-big {
    height: min(42vh, 380px); max-width: 100%; object-fit: contain;
    filter: drop-shadow(0 14px 16px rgba(0,0,0,0.4));
    cursor: pointer;
    animation: gallop 900ms cubic-bezier(.3,1.6,.4,1) both;
  }
  @keyframes gallop { from { transform: translateY(40px) scale(0.4); opacity: 0; } to { transform: none; opacity: 1; } }
  .finale .eu { font-size: 1.7rem; }
  .finale .rainbow {
    background: linear-gradient(90deg, #e03b3b, #f29a2e, #d9b422, #3aa65c, #3a6fe0, #8a4bd6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .remate {
    font-family: var(--display); font-weight: 700; font-size: 1.6rem;
    color: var(--accent); margin: 2px 0 0;
    animation: popin 400ms 900ms both;
  }
  @keyframes popin { from { opacity: 0; transform: translateY(8px) scale(0.9); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div class="bg" id="bgA"></div>
<div class="bg" id="bgB"></div>
<img id="hiker" src="assets/mendizalea.png" alt="">
<main id="stage" aria-live="polite"></main>

<script>
(function () {
  const stage = document.getElementById('stage');
  const hiker = document.getElementById('hiker');
  const bgs = [document.getElementById('bgA'), document.getElementById('bgB')];
  let bgIdx = 0, currentBg = '';

  const IMG = {
    hasiera: 'assets/hasiera.jpg',
    mendia: 'assets/mendia-bidea.jpg',
    hodeia: 'assets/hodeia.jpg',
    gailurra: 'assets/gailurra.jpg',
    zerua: 'assets/zerua-ilunabarra.jpg',
    ispilua: 'assets/ispilua.png',
    ispiluaZaldia: 'assets/ispilua-zaldia-cara.png',
    zaldia: 'assets/zaldia-gailurra-cara.png',
    relincho: 'assets/zaldia-relincho-cara.png',
  };
  // El fondo de la montaña mide 1376x768; el caminante va por el sendero en esas coordenadas.
  const MOUNTAIN = { w: 1376, h: 768, px: 0.38, py: 0.5 };

  const objetos = [
    { pic: 'assets/harria.png', eu: 'Harria', es: 'Roca.', note: 'Grande, dura y sin intención de moverse.', at: [517, 436] },
    { pic: 'assets/eguzkilorea.jpg', round: true, eu: 'Eguzkilorea', es: 'Flor del sol.', note: 'Se cuelga en la puerta para espantar brujas y malos espíritus. No garantiza nada contra caballos.', at: [465, 384] },
    { pic: 'assets/ardia.png', eu: 'Ardia', es: 'Oveja.', note: 'Te mira raro. Algo sabe.', at: [586, 333] },
    { pic: 'assets/haritza.png', eu: 'Haritza', es: 'Roble.', note: 'El de Gernika es sagrado. Este es uno cualquiera, pero no se lo digas. Descansá un rato, que ya llegás.', at: [545, 250] },
    { pic: 'assets/hodeia.jpg', round: true, eu: 'Hodeia', es: 'Nube.', note: 'Ya estás muy alto. Se escuchan ruidos raros a lo lejos…', bg: 'hodeia', neigh: true },
  ];
  // Escenas: 0 inicio, 1 intro, 2..6 objetos, 7 cima, 8 espejo, 9 final
  const TOTAL = objetos.length + 5;
  let step = 0, busy = false, hikerAt = null;

  // ---- fondo con fundido ----
  function setBg(key) {
    if (key === currentBg) return;
    currentBg = key;
    bgIdx = 1 - bgIdx;
    const next = bgs[bgIdx], prev = bgs[1 - bgIdx];
    next.style.backgroundImage = `url("${IMG[key]}")`;
    next.classList.add('on'); prev.classList.remove('on');
  }

  // ---- caminante sobre el sendero (misma matemática que background-size: cover) ----
  function placeHiker() {
    if (!hikerAt) { hiker.classList.remove('on'); return; }
    const W = window.innerWidth, H = window.innerHeight;
    const s = Math.max(W / MOUNTAIN.w, H / MOUNTAIN.h);
    const offX = (W - MOUNTAIN.w * s) * MOUNTAIN.px;
    const offY = (H - MOUNTAIN.h * s) * MOUNTAIN.py;
    hiker.style.left = (offX + hikerAt[0] * s) + 'px';
    hiker.style.top = (offY + hikerAt[1] * s) + 'px';
    hiker.style.width = Math.max(22, Math.round(40 * s)) + 'px';
    hiker.classList.add('on');
  }
  window.addEventListener('resize', placeHiker);

  // ---- relincho sintetizado con Web Audio ----
  let ctx = null;
  function relincho(lejos) {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      const t0 = ctx.currentTime, dur = lejos ? 1.1 : 1.5;
      const osc = ctx.createOscillator(); osc.type = 'sawtooth';
      const lfo = ctx.createOscillator(); lfo.type = 'sine';
      lfo.frequency.setValueAtTime(11, t0); lfo.frequency.linearRampToValueAtTime(18, t0 + dur);
      const lfoGain = ctx.createGain(); lfoGain.gain.value = lejos ? 40 : 70;
      lfo.connect(lfoGain).connect(osc.frequency);
      osc.frequency.setValueAtTime(lejos ? 820 : 1100, t0);
      osc.frequency.exponentialRampToValueAtTime(lejos ? 680 : 900, t0 + dur * 0.25);
      osc.frequency.exponentialRampToValueAtTime(lejos ? 300 : 320, t0 + dur);
      const filt = ctx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = lejos ? 900 : 2600; filt.Q.value = 2;
      const g = ctx.createGain(); const peak = lejos ? 0.05 : 0.18;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + 0.08);
      g.gain.setValueAtTime(peak, t0 + dur * 0.6);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(filt).connect(g).connect(ctx.destination);
      osc.start(t0); lfo.start(t0); osc.stop(t0 + dur + 0.05); lfo.stop(t0 + dur + 0.05);
    } catch (e) { /* sin sonido, no pasa nada */ }
  }

  // ---- escenas ----
  function el(tag, cls, html) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  function img(src, cls) { const i = el('img', cls); i.src = src; i.alt = ''; return i; }
  function button(label, onClick) {
    const b = el('button', 'btn', label); b.type = 'button';
    b.addEventListener('click', (e) => { e.stopPropagation(); onClick(); });
    return b;
  }

  function render() {
    stage.innerHTML = '';
    stage.onclick = null;
    const scene = el('div', 'scene');
    stage.appendChild(scene);
    hikerAt = null;

    if (step === 0) {
      setBg('hasiera');
      scene.classList.add('center');
      scene.appendChild(el('h1', null, 'Mendira!'));
      scene.appendChild(el('p', 'sub', '¡A la montaña!<small>Una lección de euskera en altura</small>'));
      scene.appendChild(button('Empezar a subir', next));
    }
    else if (step === 1) {
      setBg('hasiera');
      scene.classList.add('center');
      const card = el('div', 'card solo');
      card.appendChild(el('p', 'note lead', 'Hoy es un buen día para subir al monte.'));
      card.appendChild(el('p', 'note', 'Cada cosa que encuentres en el camino te va a enseñar una palabra nueva.'));
      card.appendChild(button('Vamos', next));
      scene.appendChild(card);
    }
    else if (step >= 2 && step < 2 + objetos.length) {
      const o = objetos[step - 2];
      setBg(o.bg || 'mendia');
      if (o.at) hikerAt = o.at;
      const card = el('div', 'card');
      card.appendChild(img(o.pic, 'pic' + (o.round ? ' round' : '')));
      card.appendChild(el('div', 'counter', `${step - 1} / ${objetos.length}`));
      card.appendChild(el('div', 'eu', o.eu));
      card.appendChild(el('div', 'es', o.es));
      card.appendChild(el('p', 'note', o.note));
      scene.appendChild(card);
      scene.appendChild(el('p', 'hint', 'Tocá para seguir subiendo'));
      stage.onclick = next;
      if (o.neigh) setTimeout(() => relincho(true), 1500);
    }
    else if (step === 2 + objetos.length) { // la cima
      setBg('gailurra');
      const card = el('div', 'card solo');
      card.appendChild(el('div', 'eu', 'Mendia'));
      card.appendChild(el('div', 'es', '¡Llegaste a la cima!'));
      card.appendChild(el('p', 'note', 'Hay algo brillando entre las rocas…'));
      card.appendChild(button('Acercarse', next));
      scene.appendChild(card);
    }
    else if (step === 3 + objetos.length) { // el espejo
      setBg('gailurra');
      const mirror = el('div', 'mirror');
      mirror.appendChild(img(IMG.ispilua, 'empty'));
      mirror.appendChild(img(IMG.ispiluaZaldia, 'horse'));
      scene.appendChild(mirror);
      const card = el('div', 'card solo');
      card.appendChild(el('div', 'eu', 'Ispilua'));
      card.appendChild(el('div', 'es', 'Espejo.'));
      card.appendChild(el('p', 'note', 'Mirate bien.'));
      scene.appendChild(card);
      const hint = el('p', 'hint', 'Tocá el espejo');
      scene.appendChild(hint);
      const mirarse = () => {
        if (busy) return;
        busy = true; stage.onclick = null;
        hint.textContent = '…';
        mirror.classList.add('warp');
        setTimeout(() => relincho(false), 1000);
        setTimeout(() => { busy = false; next(); }, 2900);
      };
      stage.onclick = mirarse;
    }
    else { // el final
      setBg('zerua');
      scene.classList.add('center');
      const horse = img(IMG.zaldia, 'horse-big');
      let rearing = false;
      horse.addEventListener('click', (e) => {
        e.stopPropagation();
        if (rearing) return;
        rearing = true; horse.src = IMG.relincho; relincho(false);
        setTimeout(() => { horse.src = IMG.zaldia; rearing = false; }, 1400);
      });
      scene.appendChild(horse);
      const card = el('div', 'card solo finale');
      card.appendChild(el('div', 'eu', 'Mendietako zaldi <span class="rainbow">homosexuala</span>'));
      card.appendChild(el('div', 'es', 'El pilotaduna homosexual de las montañas.'));
      card.appendChild(el('p', 'remate', 'Las ovejas lo sabían.'));
      card.appendChild(button('Subir otra vez (ya sabés qué hay)', () => { step = 0; render(); }));
      scene.appendChild(card);
      setTimeout(() => relincho(false), 500);
    }
    placeHiker();
  }

  function next() {
    if (busy) return;
    if (step < TOTAL - 1) { step++; render(); }
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') {
      if (stage.onclick) { e.preventDefault(); stage.onclick(); }
    }
  });

  // Precargar todas las imágenes para que los cambios sean instantáneos
  Object.values(IMG).concat(objetos.map(o => o.pic)).forEach(src => { const i = new Image(); i.src = src; });

  render();
  requestAnimationFrame(placeHiker);
})();
</script>
</body>
</html>
